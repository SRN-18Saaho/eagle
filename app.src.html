/* ============ GEMINI AI ============
   Paste your key from https://aistudio.google.com/apikey to get live answers.
   Leave it empty and the app shows demo answers instead.
   WARNING: a key typed here is visible to anyone who opens the page. For the real
   launch, move this call to your backend (e.g. a Supabase Edge Function) and keep the key there. */
const GEMINI_API_KEY = "";
const GEMINI_MODEL   = "gemini-2.5-flash";   // change if Google renames or retires it
const GEMINI_RULES   = "You are a helpful senior at VESIT, a B.Tech engineering college in Mumbai, answering a junior's question on a campus Q&A forum. Be clear and practical. Use short plain-text lines, no markdown symbols, under 120 words. If you are unsure, say so.";
async function askGemini(title,body){
  if(!GEMINI_API_KEY){ await new Promise(r=>setTimeout(r,900)); return null; }   // null = demo mode
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`,{
    method:"POST",
    headers:{"Content-Type":"application/json","x-goog-api-key":GEMINI_API_KEY},
    body:JSON.stringify({
      systemInstruction:{parts:[{text:GEMINI_RULES}]},
      contents:[{role:"user",parts:[{text:`Question: ${title}\n${body||""}`}]}]
    })
  });
  if(!res.ok) throw new Error("Gemini error "+res.status);
  const d = await res.json();
  return (d.candidates?.[0]?.content?.parts||[]).map(x=>x.text).join("").trim();
}

/* ============ THEME (light / dark, remembers choice) ============ */
function useTheme(){
  const [dark,setDark] = useState(()=>{
    try{ const t=localStorage.getItem("cc-theme"); if(t) return t==="dark"; }catch(e){}
    return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  });
  useEffect(()=>{
    document.documentElement.classList.toggle("dark",dark);
    try{ localStorage.setItem("cc-theme",dark?"dark":"light"); }catch(e){}
  },[dark]);
  return [dark,setDark];
}

/* ============ POSTS ============ */
function Post({p}) {
  const [vote,setVote] = useState(0);
  const [saved,setSaved] = useState(false);
  const [copied,setCopied] = useState(false);
  const seed = SEED[p.id]||[];
  const [list,setList] = useState(seed);       // comments (seniors reply here)
  const [open,setOpen] = useState(false);
  const [txt,setTxt] = useState("");
  const addComment = () => { if(!txt.trim()) return; setList([...list,{who:"Anonymous student",text:txt.trim(),time:"just now"}]); setTxt(""); setOpen(true); };
  const [ai,setAi] = useState(null);   // null | {loading} | {text,demo} | {error}
  const ask = async () => {
    if(ai&&ai.loading) return;                          // ignore clicks while an answer is loading
    if(ai) return setAi(null);                          // second click hides it
    setAi({loading:true});
    try{
      const t = await askGemini(p.title,p.body);
      setAi(t ? {text:t} : {text:p.summary.map(([k,v])=>k+": "+v).join("\n"),demo:true});
    }catch(e){ setAi({error:true}); }
  };
  useEffect(()=>{ if(p.autoAI) ask(); },[]);           // new questions get a Gemini answer straight away
  const share = () => { try{ navigator.clipboard && navigator.clipboard.writeText(location.href); }catch(e){} setCopied(true); setTimeout(()=>setCopied(false),1500); };
  return (
    <article className="card p-7">
      <div className="flex items-center gap-2 text-xs t2">
        <span className="font-bold" style={{color:TAGS[p.tag]}}>c/{p.tag}</span>
        <span>· {p.time}</span>
      </div>
      <h3 className="text-lg font-bold mt-3 leading-snug">{p.title}</h3>
      {p.body && <p className="text-sm t2 mt-3 leading-relaxed">{p.body}</p>}
      {p.img && <div className="mt-5"><ImgSpace img={p.img}/></div>}
      {ai && (
        <div className="mt-6 rounded-xl bgh p-5">
          <div className="text-sm font-bold acx">✨ Gemini</div>
          {ai.loading && <p className="text-sm t2 mt-2">Thinking...</p>}
          {ai.error && <p className="text-sm text-red-500 mt-2">Couldn't reach Gemini. Check your API key and try again.</p>}
          {ai.text && <p className="text-sm mt-2 leading-relaxed whitespace-pre-line">{ai.text}</p>}
          {ai.text && <p className="text-xs t2 mt-3">{ai.demo?"Demo answer. Add your Gemini API key in the file for live answers.":"AI-generated. Double-check with seniors."}</p>}
        </div>)}
      <div className="flex items-center gap-4 mt-6 text-sm flex-wrap">
        <div className="flex items-center rounded-full bgh">
          <button onClick={()=>setVote(vote===1?0:1)} aria-label="Upvote" className={`px-3 py-1.5 rounded-full ${vote===1?"acx font-bold":"t2"}`}>▲</button>
          <span className="font-bold text-xs min-w-[1.5rem] text-center">{p.votes+vote}</span>
          <button onClick={()=>setVote(vote===-1?0:-1)} aria-label="Downvote" className={`px-3 py-1.5 rounded-full ${vote===-1?"text-blue-500 font-bold":"t2"}`}>▼</button>
        </div>
        <button onClick={()=>setOpen(!open)} aria-expanded={open} className="px-3 py-1.5 rounded-full hv t2 text-xs font-semibold">💬 {list.length} {open?"· Hide":"· Reply"}</button>
        <button onClick={ask} className="px-4 py-1.5 rounded-full bgh font-semibold text-xs">{ai&&!ai.loading?"Hide Gemini":"✨ Ask Gemini"}</button>
        <div className="flex items-center gap-1 ml-auto">
          <Tip label={saved?"Saved":"Save"}><button onClick={()=>setSaved(!saved)} aria-label="Save post" className={`w-9 h-9 rounded-full hv text-lg ${saved?"":"opacity-70"}`}>{saved?"📌":"📍"}</button></Tip>
          <Tip label={copied?"Link copied":"Share"}><button onClick={share} aria-label="Copy link" className="w-9 h-9 rounded-full hv text-lg opacity-70 hover:opacity-100">📤</button></Tip>
        </div>
      </div>
      {open && (
        <div className="mt-6 pt-6 border-t bdr">
          <div className="space-y-5">
            {list.length===0 && <p className="text-sm t2">No replies yet. Be the first to help.</p>}
            {list.map((c,i)=>(
              <div key={i} className="flex gap-3">
                <span className="w-8 h-8 rounded-full bgh flex items-center justify-center shrink-0 text-sm">{c.senior?"🛡️":"👤"}</span>
                <div className="flex-1">
                  <div className="text-xs t2"><span className="font-bold" style={{color:"var(--tx)"}}>{c.who}</span>{c.senior && <span className="ml-2 ac rounded-full px-2 py-0.5 text-[10px] font-bold">Senior</span>} · {c.time}</div>
                  <p className="text-sm mt-1 leading-relaxed">{c.text}</p>
                </div>
              </div>))}
          </div>
          <div className="flex items-center gap-3 mt-6">
            <input value={txt} onChange={e=>setTxt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addComment()} placeholder="Write a reply..." maxLength={500} aria-label="Write a reply" className="inp flex-1 rounded-full px-5 py-2.5 text-sm"/>
            <button onClick={addComment} className="ac rounded-full px-5 py-2.5 text-sm font-bold">Reply</button>
          </div>
        </div>)}
    </article>);
}

function Composer({onPost,tag}) {
  const [draft,setDraft] = useState("");
  const [cat,setCat] = useState(tag==="All"?"DSA":tag);
  const [img,setImg] = useState(null);
  const pick = e => { const f=e.target.files[0]; if(f) setImg({src:URL.createObjectURL(f)}); e.target.value=""; };   // reset so the same file can be picked again
  const post = () => { if(!draft.trim()) return; onPost(draft.trim(),img,cat); setDraft(""); setImg(null); };
  return (
    <div className="card p-6">
      <div className="flex items-center gap-3 flex-wrap">
        <span className="w-10 h-10 rounded-full bgh flex items-center justify-center shrink-0">👤</span>
        <input value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>e.key==="Enter"&&post()} placeholder="Ask your seniors anonymously..." maxLength={200} aria-label="Your question" className="inp flex-1 min-w-[10rem] rounded-full px-5 py-3 text-sm"/>
        <label className="cursor-pointer w-10 h-10 rounded-full hv flex items-center justify-center text-lg" title="Add image">🖼️<input type="file" accept="image/*" onChange={pick} className="hidden"/></label>
        <select value={cat} onChange={e=>setCat(e.target.value)} aria-label="Community" className="inp rounded-full px-3 py-2.5 text-xs font-semibold">{Object.keys(TAGS).map(t=><option key={t} value={t}>c/{t}</option>)}</select>
        <button onClick={post} className="ac rounded-full px-6 py-2.5 text-sm font-bold">Post</button>
      </div>
      {img && <div className="mt-4 relative"><ImgSpace img={img}/><button onClick={()=>setImg(null)} className="absolute top-2 right-2 w-8 h-8 rounded-full bg-black/60 text-white text-sm">✕</button></div>}
    </div>);
}

function Feed({q,setQ,tag,setTag}) {
  const [posts,setPosts] = useState(POSTS);
  const [sort,setSort] = useState("Hot");
  const rank = p => p.votes + p.comments*2;
  const shown = posts
    .filter(p=>(tag==="All"||p.tag===tag)&&(p.title+p.body).toLowerCase().includes(q.toLowerCase()))
    .sort((a,b)=> sort==="New"?a.age-b.age : sort==="Top"?b.votes-a.votes : rank(b)-rank(a));
  const add = (title,img,cat) => {
    setPosts([{id:Date.now(),age:0,time:"just now",tag:cat,votes:1,comments:0,autoAI:true,title,body:"",img,summary:[["Demo","No Gemini key is set, so this is a placeholder. Add your key in the file for a real AI answer."]]},...posts]);
    setTag(cat); setQ(""); setSort("New");        // make sure the new post is visible at the top
  };
  return (
    <div className="space-y-8">
      <Composer onPost={add} tag={tag}/>
      <div className="flex items-center justify-between gap-4 flex-wrap">
        <div className="flex gap-1">{["Hot","New","Top"].map(s=>(
          <button key={s} onClick={()=>setSort(s)} className={`px-4 py-2 rounded-full text-sm font-semibold ${sort===s?"bgh":"t2 hv"}`}>{s}</button>))}</div>
        <div className="flex gap-2 flex-wrap">{["All",...Object.keys(TAGS)].map(t=>(
          <button key={t} onClick={()=>setTag(t)} className={`px-3.5 py-1.5 rounded-full text-xs font-semibold ${tag===t?"ac":"bdr t2"}`}>{t}</button>))}</div>
      </div>
      {shown.length===0 && <div className="card p-10 text-center t2 text-sm">No posts match. Try another word or ask it yourself above.</div>}
      {shown.map(p=><Post key={p.id} p={p}/>)}
    </div>);
}

/* ============ HACKATHONS ============ */

/* ============ RESOURCES ============ */

              <div className="font-semibold leading-snug">{p.title}</div>
              <div className="text-xs t2 mt-2"><span className="font-bold" style={{color:TAGS[p.tag]}}>c/{p.tag}</span> · ▲ {p.votes} · 💬 {p.comments}</div>

/* ============ LOGIN ============ */
function Login({onLogin,dark,setDark}) {
  const [email,setEmail] = useState("");
  const [password,setPassword] = useState("");
  const [branch,setBranch] = useState("COMP");
  const [showPw,setShowPw] = useState(false);
  const [error,setError] = useState("");
  const [sent,setSent] = useState(false);
  const submit = () => {
    if(sent) return;                           // ignore double clicks
    const e = email.trim().toLowerCase();
    if(!EMAIL_RE.test(e))
      return setError("Use your college email, like name@"+COLLEGE_DOMAIN+". Other emails can't join.");
    if(password.length < 6) return setError("Enter your password (at least 6 characters).");
    setError(""); setSent(true);               // demo only: later use supabase.auth.signInWithPassword({email,password})
    setTimeout(()=>onLogin(e,branch), 900);
  };
  return (
    <div className="min-h-screen p-4 flex items-center justify-center relative">
      <button onClick={()=>setDark(!dark)} className="absolute top-4 right-4 w-10 h-10 rounded-full card text-lg" title="Toggle theme" aria-label="Toggle theme">{dark?"☀️":"🌙"}</button>
      <div className="card w-full max-w-4xl grid md:grid-cols-2 overflow-hidden">
        <div className="p-10 text-white flex flex-col justify-center" style={{background:"linear-gradient(180deg,rgba(11,31,68,.55),rgba(11,31,68,.88)), url('__CAMPUS_IMG__') center/cover no-repeat, linear-gradient(135deg,#0B1F44,#1D4E89)"}}>
          <img src={LOGO} alt="VESIT logo" className="h-20 w-auto self-start rounded-xl bg-white p-1.5 shadow-lg"/>
          <div className="text-2xl font-extrabold mt-5">CampusConnect</div>
          <div className="text-sm opacity-70">VESIT · B.Tech students</div>
          <h1 className="text-3xl font-extrabold mt-10 leading-tight">Ask the seniors.<br/>Keep the answers.</h1>
          <p className="opacity-80 mt-3 text-sm leading-relaxed">Anonymous questions, AI thread summaries, hackathon alerts and a place to pass your books down.</p>
        </div>
        <div className="p-10 flex items-center">
          <div className="w-full">
            <h2 className="text-2xl font-extrabold">Sign in</h2>
            <p className="text-sm t2 mt-1">Use your @{COLLEGE_DOMAIN} college email.</p>
            <label htmlFor="em" className="block text-sm font-semibold mt-7">College email</label>
            <input value={email} onChange={e=>{setEmail(e.target.value);setError("")}} onKeyDown={e=>e.key==="Enter"&&submit()} id="em" autoComplete="username" placeholder={"name@"+COLLEGE_DOMAIN} className="inp w-full mt-2 rounded-xl px-4 py-3 text-sm"/>
            <label className="block text-sm font-semibold mt-5">Your branch</label>
            <select value={branch} onChange={e=>setBranch(e.target.value)} className="inp w-full mt-2 rounded-xl px-4 py-3 text-sm">
              {BRANCHES.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}
            </select>
            <label htmlFor="pw" className="block text-sm font-semibold mt-5">Password</label>
            <div className="relative">
              <input type={showPw?"text":"password"} value={password} onChange={e=>{setPassword(e.target.value);setError("")}} onKeyDown={e=>e.key==="Enter"&&submit()} id="pw" placeholder="Enter your password" autoComplete="current-password" className="inp w-full mt-2 rounded-xl px-4 py-3 pr-16 text-sm"/>
              <button type="button" onClick={()=>setShowPw(!showPw)} className="absolute right-4 top-1/2 -translate-y-1/2 mt-1 text-xs font-semibold t2">{showPw?"Hide":"Show"}</button>
            </div>
            {error && <p role="alert" className="text-sm text-red-500 mt-3">{error}</p>}
            <button onClick={submit} className="ac w-full mt-6 rounded-full py-3 text-sm font-bold">{sent?"Signing you in...":"Continue"}</button>
            <button onClick={()=>onLogin("demo@"+COLLEGE_DOMAIN,branch)} className="bdr hv w-full mt-3 rounded-full py-3 text-sm font-semibold">Use demo account</button>
          </div>
        </div>
      </div>
    </div>);
}

/* ============ APP ============ */
function App() {
  const [dark,setDark] = useTheme();
  const [user,setUser] = useState(()=>{ try{ const u=localStorage.getItem("cc-user"); return u&&EMAIL_RE.test(u)?u:null; }catch(e){ return null; } });   // stays signed in after refresh (demo only)
  const [page,setPage] = useState("home");
  const [tag,setTag] = useState("All");
  const [q,setQ] = useState("");
  const [branch,setBranch] = useState(()=>{ try{ const b=localStorage.getItem("cc-branch"); if(b&&BR[b]) return b; }catch(e){} return "COMP"; });
  useEffect(()=>{ try{ if(user) localStorage.setItem("cc-user",user); else localStorage.removeItem("cc-user"); localStorage.setItem("cc-branch",branch); }catch(e){} },[user,branch]);
  useEffect(()=>{ window.scrollTo(0,0); },[page]);   // new page starts at the top
  if(!user) return <Login onLogin={(e,b)=>{setUser(e);setBranch(b)}} dark={dark} setDark={setDark}/>;
  const withRail = page==="forum";
  return (
    <div>
      <TopBar user={user} dark={dark} setDark={setDark} q={q} setQ={setQ} setTag={setTag} setPage={setPage} onLogout={()=>{setUser(null);setPage("home");setQ("");setTag("All")}}/>
      <div className={`max-w-[1280px] mx-auto px-4 py-10 grid gap-12 lg:grid-cols-[210px_minmax(0,1fr)] ${withRail?"xl:grid-cols-[210px_minmax(0,1fr)_320px]":""}`}>
        <Sidebar page={page} setPage={setPage} tag={tag} setTag={setTag}/>
        <main>
          {page==="home" && <Home user={user} branch={branch} setPage={setPage}/>}
          {withRail && <Feed q={q} setQ={setQ} tag={tag} setTag={setTag}/>}
          {page==="hackathons" && <Hackathons/>}
          {page==="market" && <Market/>}
          {page==="profile" && <Profile user={user} branch={branch} setBranch={setBranch}/>}
        </main>
        {withRail && <RightRail setPage={setPage}/>}
      </div>
    </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
